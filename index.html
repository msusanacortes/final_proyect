        body { 
            font-family: 'Nunito', sans-serif; 
            overscroll-behavior-y: none; /* Previene el pull-to-refresh en móviles */
        }
        
        /* Ocultar scrollbars pero permitir scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones UX */
        .bounce-animation { animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-10px); } 
        }
        
        .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translate(0,  0px); }
            50%  { transform: translate(0, 15px); }
            100%   { transform: translate(0, -0px); }
        }
    </style>

            return (
                <div className="fixed top-6 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-8 py-4 rounded-[2rem] shadow-2xl z-[100] font-black text-lg animate-bounce transition-all border-4 border-white text-center w-max max-w-[90vw]">

            );

        const VideoPlayerModal = ({ playingVideo, setPlayingVideo }) => {
            if (!playingVideo) return null;
            
            const getEmbedUrl = (url) => {
                if (!url) return null;
                try {
                    let videoId = null;
                    if (url.includes('youtu.be/')) {
                        videoId = url.split('youtu.be/')[1]?.split(/[?#]/)[0];
                    } else if (url.includes('youtube.com/watch')) {
                        const urlParams = new URLSearchParams(url.split('?')[1]);
                        videoId = urlParams.get('v');
                    } else if (url.includes('youtube.com/shorts/')) {
                        videoId = url.split('shorts/')[1]?.split(/[?#]/)[0];
                    } else if (url.includes('youtube.com/embed/')) {
                        videoId = url.split('embed/')[1]?.split(/[?#]/)[0];
                    } else if (url.includes('@SuperSimpleEspanol')) {
                        videoId = 'qA-OQ-VwG-o';
                    }

                    if (videoId) {
                        return `https://www.youtube.com/embed/${videoId}`;
                    }
                } catch (e) {
                    console.error("Error al procesar la URL del video:", e);
                }
                return null;
            };

            const embedUrl = getEmbedUrl(playingVideo.url);

            const letras = ['A', 'E', 'I', 'O', 'U'];
            const [target, setTarget] = useState('');
            const [opciones, setOpciones] = useState([]);
            const [mensaje, setMensaje] = useState('');
            const [animando, setAnimando] = useState(false);

            const generarNivel = () => {
                const seleccionada = letras[Math.floor(Math.random() * letras.length)];
                setTarget(seleccionada);
                let mezclar = [...letras].sort(() => 0.5 - Math.random()).slice(0, 3);
                if (!mezclar.includes(seleccionada)) mezclar[0] = seleccionada;
                setOpciones(mezclar.sort(() => 0.5 - Math.random()));
                setMensaje('');
                setAnimando(false);
            };

            useEffect(() => { generarNivel(); }, []);

                if (animando) return;

                    setAnimando(true);

                        {error && <span className="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg font-bold">Respuesta incorrecta.</span>}
                    </div>
                    <div className="grid grid-cols-3 gap-4 md:gap-6 w-full max-w-xs md:max-w-md">
                        {[24, 32, 42].map(ans => (
                            <button key={ans} onClick={() => handleAnswer(ans)} className="bg-slate-800 p-6 rounded-[2rem] text-3xl font-black hover:bg-slate-700 hover:scale-105 active:scale-95 transition border-4 border-slate-700 hover:border-emerald-500">
                                {ans}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const ParentDashboard = ({ profiles, setProfiles, videos, setVideos, onExit, showToast }) => {
            const [selectedKid, setSelectedKid] = useState(profiles[0]);
            const [newVideoUrl, setNewVideoUrl] = useState('');

            useEffect(() => {
                setSelectedKid(prev => profiles.find(p => p.id === prev.id) || profiles[0]);
            }, [profiles]);

            const toggleVideoApproval = (videoId) => {
                const updatedKids = profiles.map(p => {
                    if (p.id === selectedKid.id) {
                        const isApproved = p.approvedVideos.includes(videoId);
                        const newApprovals = isApproved ? p.approvedVideos.filter(id => id !== videoId) : [...p.approvedVideos, videoId];
                        return { ...p, approvedVideos: newApprovals };
                    }
                    return p;
                });
                setProfiles(updatedKids);
                showToast("Permisos actualizados ✔️");
            };

            const handleAddVideo = (e) => {
                e.preventDefault();
                if (!newVideoUrl) return;

                // Magia UX: Extraer el ID del link de YouTube para obtener la miniatura real automáticamente
                let extractedId = null;
                try {
                    if (newVideoUrl.includes('youtu.be/')) extractedId = newVideoUrl.split('youtu.be/')[1]?.split(/[?#]/)[0];
                    else if (newVideoUrl.includes('youtube.com/watch')) extractedId = new URLSearchParams(newVideoUrl.split('?')[1]).get('v');
                    else if (newVideoUrl.includes('youtube.com/shorts/')) extractedId = newVideoUrl.split('shorts/')[1]?.split(/[?#]/)[0];
                } catch (err) {
                    console.error("URL inválida");
                }
                
                const dynamicThumbnail = extractedId 
                    ? `https://i.ytimg.com/vi/${extractedId}/hqdefault.jpg` 
                    : 'https://placehold.co/400x300/4f46e5/ffffff?text=Nuevo+Video';

                const newVideo = {
                    id: Date.now(),
                    title: 'Nuevo Video Agregado',
                    category: 'Educativo',
                    isNew: true, // Esto lo hará aparecer en el bloque de Novedades
                    thumbnail: dynamicThumbnail,
                    url: newVideoUrl,
                    certifiedPediatric: false, 
                    certifiedParenting: false
                };
                
                setVideos([newVideo, ...videos]); // Lo agrega al principio de la lista general
                
                // Aprobarlo automáticamente para el perfil actual (Padres no tendrán que buscarlo para encenderlo)
                setProfiles(profiles.map(p => {
                    if (p.id === selectedKid.id) {
                        return { ...p, approvedVideos: [...p.approvedVideos, newVideo.id] };
                    }
                    return p;
                }));

                setNewVideoUrl('');
                showToast("¡Video agregado exitosamente! 🎬");
            };

            return (
                <div className="h-screen lg:h-[calc(100vh-4rem)] bg-slate-50 p-4 sm:p-8 md:p-12 w-full lg:max-w-5xl mx-auto shadow-2xl relative lg:rounded-[3rem] lg:my-8 overflow-y-auto hide-scrollbar">
                    <div className="flex justify-between items-center mb-8 border-b-2 border-slate-200 pb-6 pt-4">
                        <div>
                            <h2 className="text-3xl font-black text-slate-800">Centro de Padres</h2>
                            <p className="text-slate-500 font-bold mt-1">Gestión de contenido seguro</p>
                        </div>
                        <button onClick={onExit} className="flex items-center gap-2 bg-slate-200 text-slate-700 px-5 py-3 rounded-2xl font-black hover:bg-slate-300 transition active:scale-95">
                            <Home className="w-6 h-6"/> Salir
                        </button>
                    </div>
                    
                    <div className="mb-3">
                        <h3 className="text-lg font-black text-slate-700 flex items-center gap-2">
                            <span className="bg-indigo-100 text-indigo-600 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span> 
                            Selecciona el perfil a gestionar:
                        </h3>
                    </div>
                    <div className="flex gap-4 mb-8 overflow-x-auto hide-scrollbar pb-2">
                        {profiles.map(kid => (
                            <button key={kid.id} onClick={() => setSelectedKid(kid)} className={`flex items-center gap-3 px-6 py-4 rounded-[2rem] font-black transition ${selectedKid.id === kid.id ? 'bg-indigo-600 text-white shadow-lg scale-105' : 'bg-white text-slate-600 border-2 border-slate-200'}`}>
                                <span className="text-2xl">{kid.avatar}</span> {kid.name}
                            </button>
                        ))}
                    </div>

                    <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 mb-8">
                        <h3 className="text-xl font-black text-slate-800 mb-4 flex items-center gap-2">
                            <Shield className="w-6 h-6 text-emerald-500"/>
                            Videos permitidos para {selectedKid.name}
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto pr-2 hide-scrollbar">
                            {videos.map(video => {
                                const isApproved = selectedKid.approvedVideos.includes(video.id);
                                return (
                                    <div key={video.id} className={`flex items-center justify-between p-4 rounded-2xl border-2 transition ${isApproved ? 'border-emerald-200 bg-emerald-50' : 'border-slate-100 bg-slate-50'}`}>
                                        <div className="flex items-center gap-4">
                                            <img 
                                                src={video.thumbnail} 
                                                className="w-16 h-16 rounded-xl object-cover" 
                                                alt="thumb"
                                                onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x100/e2e8f0/475569?text=Vid'; }}
                                            />
                                            <div>
                                                <h4 className="font-bold text-slate-800 leading-tight">{video.title}</h4>
                                                <div className="flex gap-2 mt-1">
                                                    {video.certifiedPediatric && <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-md font-bold">🩺 Pediatría</span>}
                                                    {video.certifiedParenting && <span className="text-[10px] bg-purple-100 text-purple-700 px-2 py-1 rounded-md font-bold">👨‍👩‍👦 Parenting</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <button onClick={() => toggleVideoApproval(video.id)} className={`w-14 h-8 rounded-full relative transition-colors ${isApproved ? 'bg-emerald-500' : 'bg-slate-300'}`}>
                                            <div className={`absolute top-1 w-6 h-6 rounded-full bg-white transition-transform ${isApproved ? 'left-7' : 'left-1'}`}></div>
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="bg-indigo-50 p-6 rounded-[2rem] border border-indigo-100">
                        <h3 className="text-xl font-black text-indigo-900 mb-2">Añadir Video Externo</h3>
                        <p className="text-indigo-600/80 text-sm mb-4">Pega un link de YouTube Kids o Vimeo para agregarlo al catálogo general.</p>
                        <form onSubmit={handleAddVideo} className="flex gap-2">
                            <input type="url" value={newVideoUrl} onChange={e => setNewVideoUrl(e.target.value)} placeholder="https://youtube.com/..." required className="flex-1 px-4 py-3 rounded-2xl border-2 border-indigo-200 focus:border-indigo-500 outline-none font-bold text-slate-700" />
                            <button type="submit" className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black hover:bg-indigo-700 active:scale-95 transition">
                                <Plus className="w-6 h-6" />
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        function App() {
            // Estado Global
            const [profiles, setProfiles] = useState(INITIAL_PROFILES);
            const [videos, setVideos] = useState(INITIAL_VIDEOS);
            const [activeProfileId, setActiveProfileId] = useState(null);
            const [currentView, setCurrentView] = useState('splash');
            const [activeCategory, setActiveCategory] = useState('Todos');
            const [playingVideo, setPlayingVideo] = useState(null);
            const [toastMessage, setToastMessage] = useState('');

            const activeProfile = profiles.find(p => p.id === activeProfileId);

            // Controladores Globales
            const login = (id) => { setActiveProfileId(id); setCurrentView('kids_home'); };
            const logout = () => { setActiveProfileId(null); setCurrentView('selector'); };
            
            const addStars = (amount) => {
                setProfiles(profiles.map(p => p.id === activeProfileId ? { ...p, stars: p.stars + amount } : p));
                showToast(`¡Ganaste ${amount} estrella${amount > 1 ? 's' : ''}! 🌟`);
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const toggleFavorite = (videoId) => {
                setProfiles(profiles.map(p => {
                    if (p.id === activeProfileId) {
                        const isFav = p.favorites.includes(videoId);
                        return { ...p, favorites: isFav ? p.favorites.filter(id => id !== videoId) : [...p.favorites, videoId] };
                    }
                    return p;
                }));
            };

            const playVideo = (video) => {
                setProfiles(profiles.map(p => {
                    if (p.id === activeProfileId) {
                        const newHistory = [video.id, ...p.history.filter(id => id !== video.id)].slice(0, 20);
                        return { ...p, history: newHistory };
                    }
                    return p;
                }));
                setPlayingVideo(video);
            };

            return (
                <>
                    {/* Componente Global de Notificaciones */}
                    <Toast message={toastMessage} />
                    
                    {currentView === 'splash' && (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-sky-100 to-indigo-100 p-6 relative overflow-hidden">
                            <div className="absolute top-10 left-10 w-24 h-24 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-pulse"></div>
                            <div className="absolute bottom-20 right-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-pulse" style={{animationDelay: '1s'}}></div>
                            <img src="logo.png" alt="WowosPlay Logo" className="w-80 md:w-96 mb-16 drop-shadow-2xl z-10 floating" onError={(e) => { e.target.style.display = 'none'; }} />
                            <button onClick={() => setCurrentView('selector')} className="z-10 bg-gradient-to-r from-emerald-400 to-emerald-500 text-white text-3xl font-black py-5 px-16 rounded-[3rem] shadow-[0_8px_0_0_rgba(16,185,129,1)] hover:translate-y-1 hover:shadow-[0_4px_0_0_rgba(16,185,129,1)] active:translate-y-3 active:shadow-none transition-all border-4 border-white">
                                ¿Listo? ¡Vamos!
                            </button>
                        </div>
                    )}

                    {currentView === 'selector' && (
                        <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 p-6 font-sans">
                            <h1 className="text-4xl md:text-5xl font-black text-indigo-800 mb-12 text-center drop-shadow-sm">Elige un perfil</h1>
                            <div className="grid grid-cols-2 md:gap-12 gap-8 w-full max-w-lg md:max-w-2xl">
                                {profiles.map(profile => (
                                    <button key={profile.id} onClick={() => login(profile.id)} className={`${profile.color} rounded-[3rem] p-8 flex flex-col items-center justify-center shadow-[0_8px_0_0_rgba(0,0,0,0.15)] transform transition hover:-translate-y-2 active:translate-y-2 active:shadow-none border-4 border-white group`}>
                                        <div className="bg-white/30 rounded-full w-24 h-24 mb-4 flex items-center justify-center group-hover:scale-110 transition-transform"><span className="text-6xl">{profile.avatar}</span></div>
                                        <span className="text-3xl font-black text-white drop-shadow-md">{profile.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {currentView === 'parent_gate' && (
                        <ParentGate onVerify={() => setCurrentView('parent_dashboard')} onCancel={() => setCurrentView(activeProfileId ? 'kids_home' : 'selector')} />
                    )}

                    {currentView === 'parent_dashboard' && (
                        <ParentDashboard profiles={profiles} setProfiles={setProfiles} videos={videos} setVideos={setVideos} showToast={showToast} onExit={() => setCurrentView(activeProfileId ? 'kids_home' : 'selector')} />
                    )}

                    {currentView === 'game_letters' && (
                        <LetrasGame onExit={() => setCurrentView('kids_games')} addStars={addStars} />
                    )}

                    {currentView === 'game_numbers' && (
                        <NumerosGame onExit={() => setCurrentView('kids_games')} addStars={addStars} />
                    )}

                    {['kids_home', 'kids_games', 'kids_history', 'kids_favorites'].includes(currentView) && activeProfile && (
                        <div className="flex flex-col h-screen lg:h-[calc(100vh-4rem)] bg-indigo-50 font-sans w-full lg:max-w-5xl mx-auto relative shadow-2xl overflow-hidden lg:rounded-[3rem] lg:my-8">
                            <div className="bg-white px-6 md:px-12 pt-8 lg:pt-6 pb-6 rounded-b-[2.5rem] shadow-sm flex justify-between items-center z-20 flex-shrink-0">
                                <div className="flex items-center gap-4 cursor-pointer hover:opacity-80 transition" onClick={logout}>
                                    <div className={`${activeProfile.color} w-16 h-16 rounded-[1.5rem] flex items-center justify-center text-3xl shadow-inner border-4 border-white transform rotate-3`}>{activeProfile.avatar}</div>
                                    <div>
                                        <p className="text-sm text-slate-400 font-black uppercase tracking-wider">¡HOLA!</p>
                                        <h1 className="text-2xl font-black text-slate-800 leading-none">{activeProfile.name}</h1>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <button onClick={() => setCurrentView('parent_gate')} className="p-3 bg-slate-100 rounded-full text-slate-400 hover:bg-slate-200 active:scale-95 transition"><Lock className="w-6 h-6" /></button>
                                    <div className="flex items-center gap-1 bg-yellow-100 text-yellow-600 px-3 py-1 rounded-full font-black text-sm"><Star className="w-4 h-4" fill="currentColor" /> {activeProfile.stars}</div>
                                </div>
                            </div>

                            <div className="p-6 md:p-10 lg:p-12 space-y-8 md:space-y-12 flex-1 overflow-y-auto pb-32 hide-scrollbar">
                                {currentView === 'kids_games' && (
                                    <section className="animate-fade-in">
                                        <h2 className="text-2xl font-black text-slate-800 mb-4 flex items-center gap-2"><Gamepad className="text-indigo-500 w-6 h-6" /> ¡A Jugar!</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                                            <button onClick={() => setCurrentView('game_letters')} className="bg-blue-500 text-white p-6 rounded-[2rem] flex items-center gap-6 shadow-[0_6px_0_0_rgba(37,99,235,1)] active:translate-y-2 active:shadow-none transition group">
                                                <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl group-hover:scale-110 transition">A</div>
                                                <div className="text-left"><h3 className="font-black text-2xl">Letras Locas</h3><p className="font-bold opacity-80">Encuentra la vocal</p></div>
                                            </button>
                                            <button onClick={() => setCurrentView('game_numbers')} className="bg-emerald-500 text-white p-6 rounded-[2rem] flex items-center gap-6 shadow-[0_6px_0_0_rgba(5,150,105,1)] active:translate-y-2 active:shadow-none transition group">
                                                <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-4xl group-hover:scale-110 transition">123</div>
                                                <div className="text-left"><h3 className="font-black text-2xl">Números</h3><p className="font-bold opacity-80">Cuenta las manzanas</p></div>
                                            </button>
                                        </div>
                                    </section>
                                )}

                                {currentView === 'kids_home' && videos.filter(v => activeProfile.approvedVideos.includes(v.id) && v.isNew).length > 0 && (
                                    <section>
                                        <h2 className="text-2xl font-black text-slate-800 mb-4 flex items-center gap-2"><Sparkles className="text-yellow-500 w-6 h-6" /> ¡Nuevos!</h2>
                                        <div className="flex overflow-x-auto gap-4 md:gap-6 pb-4 snap-x hide-scrollbar">
                                            {videos.filter(v => activeProfile.approvedVideos.includes(v.id) && v.isNew).map(video => (
                                                <div key={video.id} onClick={() => playVideo(video)} className="snap-center shrink-0 w-64 relative rounded-[2rem] overflow-hidden shadow-lg cursor-pointer transform transition hover:scale-105 active:scale-95">
                                                    <div className="absolute top-3 left-3 bg-red-500 text-white text-xs font-black px-4 py-2 rounded-full z-10 animate-bounce shadow-md">NUEVO</div>
                                                    <img 
                                                        src={video.thumbnail} 
                                                        alt={video.title} 
                                                        className="w-full h-40 object-cover" 
                                                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/400x250/e2e8f0/475569?text=Video'; }}
                                                    />
                                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent"></div>
                                                    <div className="absolute inset-0 flex items-center justify-center"><div className="bg-white/30 p-4 rounded-full backdrop-blur-sm"><Play className="w-8 h-8 text-white" fill="currentColor" /></div></div>
                                                    <div className="absolute bottom-0 left-0 right-0 p-5"><h3 className="text-white font-black text-lg leading-tight truncate">{video.title}</h3></div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>
                                )}

                                {currentView === 'kids_home' && (
                                    <div className="flex overflow-x-auto gap-3 pb-2 hide-scrollbar">
                                        {CATEGORIES.map(cat => {
                                            const IconComponent = cat.icon;
                                            const isActive = activeCategory === cat.name;
                                            return (
                                                <button key={cat.name} onClick={() => setActiveCategory(cat.name)} className={`flex items-center gap-2 px-6 py-4 rounded-[1.5rem] font-black whitespace-nowrap transition-all ${isActive ? 'bg-indigo-600 text-white shadow-md scale-105' : 'bg-white text-slate-500 border-2 border-slate-100 hover:bg-slate-50'}`}>
                                                    <IconComponent className={`w-5 h-5 ${isActive ? 'text-white' : 'text-indigo-400'}`} /> {cat.name}
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {currentView !== 'kids_games' && (() => {
                                    const kidApprovedVideos = videos.filter(v => activeProfile.approvedVideos.includes(v.id));
                                    let displayVideos = [];
                                    if (currentView === 'kids_history') displayVideos = activeProfile.history.map(id => kidApprovedVideos.find(v => v.id === id)).filter(Boolean);
                                    else if (currentView === 'kids_favorites') displayVideos = activeProfile.favorites.map(id => kidApprovedVideos.find(v => v.id === id)).filter(Boolean);
                                    else displayVideos = activeCategory === 'Todos' ? kidApprovedVideos : kidApprovedVideos.filter(v => v.category === activeCategory);

                                    return (
                                        <section>
                                            <h2 className="text-2xl font-black text-slate-800 mb-6">
                                                {currentView === 'kids_history' ? 'Ya lo viste' : currentView === 'kids_favorites' ? 'Tus Favoritos' : activeCategory === 'Todos' ? 'Para ti' : activeCategory}
                                            </h2>
                                            {displayVideos.length === 0 ? (
                                                <div className="text-center py-12 bg-white/50 rounded-[2rem] border-4 border-dashed border-slate-200">
                                                    <div className="text-5xl mb-4 opacity-50">👻</div>
                                                    <p className="text-slate-400 font-black text-lg">¡Aún no hay videos aquí!</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                                                    {displayVideos.map(video => {
                                                        const isFavorite = activeProfile.favorites.includes(video.id);
                                                        return (
                                                            <div key={video.id} className="bg-white rounded-[1.5rem] overflow-hidden shadow-sm border-2 border-slate-100 flex flex-col relative group">
                                                                <button onClick={(e) => { e.stopPropagation(); toggleFavorite(video.id); }} className="absolute top-2 right-2 p-2 bg-white/90 backdrop-blur-sm rounded-full z-10 shadow-sm hover:scale-110 active:scale-90 transition">
                                                                    <Heart className={`w-5 h-5 ${isFavorite ? 'text-red-500' : 'text-slate-300'}`} fill={isFavorite ? "currentColor" : "none"} />
                                                                </button>
                                                                <div onClick={() => playVideo(video)} className="relative cursor-pointer">
                                                                    <img 
                                                                        src={video.thumbnail} 
                                                                        alt={video.title} 
                                                                        className="w-full h-32 object-cover"
                                                                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/400x250/e2e8f0/475569?text=Video'; }}
                                                                    />
                                                                    <div className="absolute inset-0 bg-slate-900/10 group-hover:bg-slate-900/30 transition flex items-center justify-center"><Play className="w-12 h-12 text-white opacity-80 drop-shadow-md group-hover:scale-110 transition-transform" fill="currentColor" /></div>
                                                                </div>
                                                                <div className="p-4"><h3 className="font-black text-slate-800 text-sm leading-tight line-clamp-2">{video.title}</h3></div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </section>
                                    );
                                })()}
                            </div>

                            <div className="absolute bottom-0 w-full bg-white px-6 md:px-16 py-4 flex justify-between md:justify-around items-center rounded-t-[2.5rem] lg:rounded-b-[3rem] shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-20 pb-8 lg:pb-4 flex-shrink-0">
                                <NavButton icon={Home} label="Videos" isActive={currentView === 'kids_home'} onClick={() => setCurrentView('kids_home')} />
                                <NavButton icon={Gamepad} label="Juegos" isActive={currentView === 'kids_games'} onClick={() => setCurrentView('kids_games')} />
                                <NavButton icon={Heart} label="Favoritos" isActive={currentView === 'kids_favorites'} onClick={() => setCurrentView('kids_favorites')} />
                                <NavButton icon={Clock} label="Historial" isActive={currentView === 'kids_history'} onClick={() => setCurrentView('kids_history')} />
                            </div>

                            <VideoPlayerModal playingVideo={playingVideo} setPlayingVideo={setPlayingVideo} />
                        </div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
